<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector NFC RFID Kinder</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;

      padding: 40px;

      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      padding: 14px 24px;

      border: none;

      border-radius: 10px;

      background: #4caf50;

      color: white;

      font-size: 18px;

      cursor: pointer;
    }

    #uid {
      margin-top: 30px;

      padding: 20px;

      background: white;

      border-radius: 10px;

      font-size: 24px;

      word-break: break-word;
    }

    #status {
      margin-top: 20px;

      color: #555;
    }
  </style>

</head>

<body>

  <h1>Lector NFC RFID Kinder</h1>

  <button onclick="startScan()">
    Iniciar lectura NFC
  </button>

  <p id="status">
    Presiona el botón y acerca una etiqueta NFC.
  </p>

  <div id="uid">
    UID aparecerá aquí...
  </div>

  <script>
    async function startScan() {

      if (!("NDEFReader" in window)) {

        alert(
          "Este dispositivo o navegador no soporta Web NFC."
        );

        return;
      }

      try {

        const ndef = new NDEFReader();

        await ndef.scan();

        document.getElementById("status").textContent =
          "Esperando etiqueta NFC...";

        ndef.addEventListener(
          "reading",
          ({ serialNumber }) => {

            document.getElementById("uid").textContent =
              serialNumber;

            document.getElementById("status").textContent =
              "Etiqueta leída correctamente";

            console.log(
              "UID:",
              serialNumber
            );
          }
        );

        ndef.addEventListener(
          "readingerror",
          () => {

            document.getElementById("status").textContent =
              "No fue posible leer la etiqueta.";
          }
        );

      } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
          "Error al iniciar el lector NFC.";
      }
    }
  </script>

</body>
</html>
