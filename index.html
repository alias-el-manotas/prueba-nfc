<!DOCTYPE html>
<html>
<body>

<h1>Prueba NFC</h1>

<button id="btn">
Escanear NFC
</button>

<div id="resultado"></div>

<script>

document.getElementById("btn").addEventListener("click", async () => {

    const resultado =
        document.getElementById("resultado");

    try {

        const ndef = new NDEFReader();

        await ndef.scan();

        resultado.innerHTML =
            "Acerca una etiqueta NFC";

        ndef.addEventListener("reading", event => {

            resultado.innerHTML =
                `
                Serial: ${event.serialNumber}
                `;
        });

    }
    catch(error){

        resultado.innerHTML =
            error.message;
    }

});

</script>

</body>
</html>
